name: Windows installer candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install build tools
        run: python -m pip install pyinstaller==6.16.0 pytest
      - name: Installer contract tests
        run: python -m pytest tests/test_install_core.py tests/test_install_runner.py tests/test_bootstrapper.py tests/test_windows_release.py -q
      - name: Build frontend from lockfile
        working-directory: web/frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build EXE and payload with reviewed dependency lock
        run: python scripts/build_windows_release.py
      - name: Frozen entry point smoke test
        shell: pwsh
        run: |
          $candidate = Get-ChildItem dist/windows-installer/Easel-Setup-*.exe | Select-Object -First 1
          & $candidate.FullName --help
          if ($LASTEXITCODE -ne 0) { throw 'Frozen installer failed to start' }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-candidate
          path: dist/windows-installer/
          if-no-files-found: error
