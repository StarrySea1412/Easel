name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend contracts and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run frontend regression tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build production frontend
        run: npm run build

  validate-skills:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate skill metadata, layout and execution contracts
        run: python scripts/validate_skills.py
      - name: Check documented commands against real argparse schemas
        run: python scripts/validate_skill_commands.py

  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Easel and test dependencies
        run: python -m pip install -e . pytest
      # 不要改回 `pytest tests/`：技能自带的用例在 skills/**/tests/ 下，限定目录就把它们
      # （目前 38 个，skill-wechat-publisher 那批）整批排除在 CI 之外 —— 本地 `pytest` 全绿、
      # CI 也全绿，但那部分从来没在 CI 上跑过。从根目录跑一次，两边都覆盖。
      - name: Run unit tests
        run: python -m pytest -v
