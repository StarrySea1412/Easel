name: easel
services:
  app:
    image: ${EASEL_IMAGE:?Set the fixed Easel release image}
    depends_on:
      browser: {condition: service_healthy}
    build:
      context: ../..
      dockerfile: deployment/138/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      EASEL_ROOT: /app
      EASEL_DATA_DIR: /data
      EASEL_HOST: 0.0.0.0
      EASEL_PORT: "7880"
      EASEL_OPENCLAW_STATE_DIR: /state/openclaw
      OPENCLAW_STATE_DIR: /state/openclaw
      OPENCLAW_CONFIG_PATH: /state/openclaw/openclaw.json
      EASEL_OPENCLAW_WORKSPACE: /state/openclaw/workspace
      EASEL_CODEX_HOME: /state/codex
      EASEL_CODEX_ENABLED: "0"
      EASEL_RAW_STREAM_PATH: /data/logs/raw-stream.jsonl
      OPENCLAW_RAW_STREAM: "1"
      OPENCLAW_RAW_STREAM_PATH: /data/logs/raw-stream.jsonl
      EASEL_EXTRA_HOSTS: ${EASEL_HOSTNAME:?Set the exact hostname or IP}
      EASEL_EXTRA_ORIGINS: https://${EASEL_HOSTNAME}:${EASEL_HTTPS_PORT:-8444}
      EASEL_ACCESS_FILE: /run/secrets/access.json
      EASEL_MODEL_BOOTSTRAP_FILE: /run/secrets/model-bootstrap.json
      EASEL_BROWSER_AUTH_FILE: /run/secrets/browser-auth.json
      EASEL_BROWSER_CDP_ENDPOINT: http://browser:18801
      EASEL_AGENT_LIMIT: "1"
      EASEL_BROWSER_LIMIT: "1"
      EASEL_MEDIA_LIMIT: "1"
      EASEL_DEPLOYMENT_MODE: ${EASEL_DEPLOYMENT_MODE:-production}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: /opt/chromium
      XDG_CACHE_HOME: /state/cache
      MPLCONFIGDIR: /state/cache/matplotlib
      HOME: /state/home
    volumes:
      - ${EASEL_DATA_PATH:?Set the persistent data directory}:/data
      - ${EASEL_STATE_PATH:?Set the persistent state directory}:/state
      - ${EASEL_SECRETS_PATH:?Set the secrets directory}/access.json:/run/secrets/access.json:ro
      - ${EASEL_SECRETS_PATH}/model-bootstrap.json:/run/secrets/model-bootstrap.json:ro
      - ${EASEL_SECRETS_PATH}/browser-auth.json:/run/secrets/browser-auth.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    # The 2 GiB cap killed the Gateway during observed chat/browser work.
    # Keep the measured host override across recreations; isolated runs can
    # select a smaller budget explicitly through their deployment env file.
    mem_limit: ${EASEL_APP_MEMORY_LIMIT:-3g}
    cpus: 2.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, /app/deployment/138/healthcheck.py]
      interval: 20s
      timeout: 6s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  browser:
    image: ${EASEL_IMAGE:?Set the fixed Easel release image}
    command: [python, /app/deployment/138/browser_sidecar.py]
    restart: unless-stopped
    user: "1000:1000"
    environment:
      EASEL_BROWSER_AUTH_FILE: /run/secrets/browser-auth.json
      EASEL_BROWSER_CDP_HOST: browser:18801
      LP_NUM_THREADS: "2"
    volumes:
      - ${EASEL_SECRETS_PATH}/browser-auth.json:/run/secrets/browser-auth.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    shm_size: 256mb
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - apparmor=easel-browser
      - seccomp=${EASEL_BROWSER_SECCOMP_PATH:?Set the release browser seccomp file}
    healthcheck:
      test: [CMD, python, /app/deployment/138/browser_healthcheck.py]
      interval: 20s
      timeout: 6s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
  proxy:
    image: ${EASEL_NGINX_IMAGE:-nginx:1.29.2-alpine@sha256:61e01287e546aac28a3f56839c136b31f590273f3b41187a36f46f6a03bbfe22}
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    ports:
      - ${EASEL_BIND_IP:-192.168.0.138}:${EASEL_HTTPS_PORT:-8444}:8444
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EASEL_SECRETS_PATH}/tls:/etc/nginx/tls:ro
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
