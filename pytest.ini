[pytest]
addopts = --import-mode=importlib
# data/ holds the installed OpenClaw workspace; its skill copies share conftest
# module names with the repo tree and would abort collection.
# outputs/ holds run artifacts (staged skill copies, generated projects). None of it is
# tracked by git, but 100+ test_*.py files live there and one duplicated conftest aborts
# collection of the whole suite, so the tree must stay out of discovery.
norecursedirs = .* build dist CVS _darcs {arch} *.egg node_modules venv data outputs
